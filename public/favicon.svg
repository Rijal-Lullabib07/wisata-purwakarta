<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1321"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="m1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="m2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="w" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Back mountain -->
  <path d="M4,44 L18,22 L28,32 L36,18 L46,30 L54,22 L60,44 Z" fill="url(#m2)" opacity="0.45"/>

  <!-- Front mountain -->
  <path d="M2,46 L16,24 L26,34 L36,20 L46,32 L54,26 L62,46 Z" fill="url(#m1)"/>

  <!-- Snow cap -->
  <path d="M33,22 L36,20 L39,22 L37,23 L36,21.5 L35,23 Z" fill="#f1f5f9" opacity="0.7"/>

  <!-- Sun -->
  <circle cx="50" cy="16" r="5" fill="#fbbf24" opacity="0.85"/>

  <!-- Water -->
  <ellipse cx="32" cy="48" rx="28" ry="7" fill="url(#w)"/>

  <!-- Water line -->
  <line x1="18" y1="47" x2="46" y2="47" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>

  <!-- PW text -->
  <text x="32" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="8" fill="#34d399" letter-spacing="1">PW</text>
</svg>
