<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1321"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sunGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#skyGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Stars -->
  <circle cx="45" cy="40" r="1.2" fill="#f1f5f9" opacity="0.6"/>
  <circle cx="155" cy="35" r="1" fill="#f1f5f9" opacity="0.4"/>
  <circle cx="75" cy="28" r="0.8" fill="#f1f5f9" opacity="0.5"/>
  <circle cx="130" cy="48" r="1.1" fill="#f1f5f9" opacity="0.3"/>
  <circle cx="55" cy="55" r="0.7" fill="#f1f5f9" opacity="0.4"/>

  <!-- Sun/Moon glow -->
  <circle cx="140" cy="52" r="18" fill="#fbbf24" opacity="0.08" filter="url(#sunGlow)"/>
  <circle cx="140" cy="52" r="11" fill="url(#sunGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Back mountain (teal) -->
  <path d="M10,130 L55,65 L78,90 L100,55 L130,85 L155,60 L190,130 Z" fill="url(#mountainGrad2)" opacity="0.5"/>

  <!-- Front mountain (green) -->
  <path d="M5,135 L50,70 L72,95 L100,58 L128,88 L150,68 L195,135 Z" fill="url(#mountainGrad)"/>

  <!-- Mountain snow cap -->
  <path d="M92,62 L100,58 L108,62 L104,64 L100,61 L96,64 Z" fill="#f1f5f9" opacity="0.7"/>

  <!-- Trees silhouettes -->
  <path d="M25,130 L30,115 L35,130 Z" fill="#047857" opacity="0.6"/>
  <path d="M32,130 L38,112 L44,130 Z" fill="#047857" opacity="0.5"/>
  <path d="M155,128 L160,114 L165,128 Z" fill="#047857" opacity="0.5"/>
  <path d="M162,128 L168,110 L174,128 Z" fill="#047857" opacity="0.4"/>

  <!-- Water/Lake -->
  <ellipse cx="100" cy="142" rx="85" ry="18" fill="url(#waterGrad)"/>

  <!-- Water ripples -->
  <ellipse cx="70" cy="140" rx="20" ry="2" fill="#06b6d4" opacity="0.2"/>
  <ellipse cx="120" cy="145" rx="25" ry="2" fill="#10b981" opacity="0.15"/>
  <ellipse cx="90" cy="148" rx="15" ry="1.5" fill="#06b6d4" opacity="0.15"/>

  <!-- Reflection shimmer -->
  <line x1="80" y1="138" x2="120" y2="138" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>
  <line x1="85" y1="142" x2="115" y2="142" stroke="#fbbf24" stroke-width="0.3" opacity="0.2"/>

  <!-- Text "PW" monogram -->
  <text x="100" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="16" fill="#f1f5f9" letter-spacing="2">PURWAKARTA</text>
  <text x="100" y="192" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="10" fill="#34d399" letter-spacing="4">WISATA</text>
</svg>
